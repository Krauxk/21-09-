<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Para ti 🌻</title>

    <link
        rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PANTALLA INICIAL -->

    <section
        id="inicio"
        class="pantalla inicio"
    >

        <div class="contenido-inicio">

            <p class="fecha">
                21 • 09 💛
            </p>

            <h1>
                Tengo algo para ti...
            </h1>

            <p class="subtitulo">
                Es pequeñito, pero está hecho con mucho amor.
            </p>

            <button id="abrirSorpresa">
                Descubrir 🌻
            </button>

        </div>

    </section>


    <!-- SORPRESA -->

    <section
        id="sorpresa"
        class="pantalla sorpresa"
    >

        <div id="petalos"></div>


        <div class="mensaje">

            <div class="flor-grande">
                🌻
            </div>

            <p class="pequeno">
                Para ti
            </p>

            <h2>
                Flores amarillas
                <span>💛</span>
            </h2>

            <p class="texto">
                Porque si pudiera regalarte una flor
                cada vez que pienso en ti,
                tendrías un jardín infinito.
            </p>

            <p class="texto-final">
                Feliz 21 de septiembre, mi amor.
            </p>

            <div class="ramo">
                🌻 🌼 🌻 🌼 🌻
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
